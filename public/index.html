<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nvidia NIM Proxy</title>
<style>
  :root {
    --bg: #191d24;
    --island-s: #1d3e48;
    --island-s-title: #2e5f6e;
    --island-l: #3f3f3f;
    --island-l-title: #545454;
    --accent: #5fd7ff;
    --ok: #5fd75f;
    --warn: #ffd75f;
    --err: #ff5f5f;
    --violet: #af87ff;
    --dim: #8b9bb4;
    --text: #e8e8e8;
    --chip-a: #3b4261;
    --chip-b: #414868;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    padding: 16px;
  }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  header .logo { color: var(--accent); font-weight: 700; font-size: 18px; }
  header .muted { color: var(--dim); }
  .island { border-radius: 6px; overflow: hidden; margin-bottom: 14px; }
  .island .strip { padding: 4px 10px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .island .body { padding: 8px 12px; min-height: 40px; }
  .island.sessions { background: var(--island-s); }
  .island.sessions .strip { background: var(--island-s-title); }
  .island.info { background: var(--island-l); }
  .island.info .strip { background: var(--island-l-title); }
  .cards { display: flex; flex-wrap: wrap; gap: 8px; }
  .card { background: var(--chip-a); border-radius: 4px; padding: 6px 12px; }
  .card:nth-child(even) { background: var(--chip-b); }
  .card .k { color: var(--dim); font-size: 12px; }
  .card .v { font-size: 16px; }
  .group-label { color: var(--dim); align-self: center; margin: 0 2px; }
  .group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .group + .group { margin-top: 8px; border-top: 1px dashed #555; padding-top: 8px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 3px 10px 3px 0; }
  th { color: var(--dim); font-weight: normal; font-size: 12px; }
  .state-waiting { color: var(--warn); }
  .state-generating { color: var(--ok); }
  .state-backoff { color: var(--err); }
  .state-cached { color: var(--violet); }
  .aborted { color: var(--err); }
  button {
    background: var(--chip-b); color: var(--text); border: none; border-radius: 4px;
    padding: 4px 12px; cursor: pointer; font: inherit;
  }
  button:hover { background: var(--accent); color: #111; }
  .chart-wrap svg { display: block; max-width: 100%; }
  .chart-legend { color: var(--dim); font-size: 12px; margin-top: 6px; display: flex; gap: 16px; }
  .tooltip {
    position: fixed; pointer-events: none; z-index: 10;
    background: #0f1420; border: 1px solid #3b4261; border-radius: 4px;
    padding: 4px 8px; font-size: 12px; display: none;
  }
  .muted { color: var(--dim); }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/htm@3/dist/htm.umd.js"></script>
</head>
<body>
<div id="root"></div>
<script type="module">
  const { useState, useEffect, useMemo, useRef } = React;
  const html = htm.bind(React.createElement);

  const fmt = (v, unit = 's') => v == null ? '-' : `${Number(v).toFixed(2)}${unit}`;

  function usePoll(path, ms) {
    const [data, setData] = useState(null);
    useEffect(() => {
      let alive = true;
      const tick = () => fetch(path).then(r => r.json()).then(d => alive && setData(d)).catch(() => {});
      tick();
      const t = setInterval(tick, ms);
      return () => { alive = false; clearInterval(t); };
    }, [path, ms]);
    return data;
  }

  function StatCard({ k, v }) {
    return html`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  }

  function StatsIsland({ stats }) {
    const now = stats?.now || {};
    const all = stats?.all || {};
    return html`
      <div class="island info">
        <div class="strip"><span>▣ Stats</span></div>
        <div class="body">
          <div class="group">
            <span class="group-label">now</span>
            <${StatCard} k="active" v=${now.active ?? 0} />
            <${StatCard} k="run ok" v=${now.count ?? 0} />
            <${StatCard} k="TTFT avg" v=${fmt(now.avgTTFT)} />
            <${StatCard} k="gen avg" v=${fmt(now.avgGen)} />
            <${StatCard} k="429" v=${now.rateLimited ?? 0} />
          </div>
          <div class="group">
            <span class="group-label">all</span>
            <${StatCard} k="history" v=${all.count ?? 0} />
            <${StatCard} k="ok" v=${all.ok ?? 0} />
            <${StatCard} k="TTFT avg" v=${fmt(all.avgTTFT)} />
            <${StatCard} k="gen avg" v=${fmt(all.avgGen)} />
            <${StatCard} k="429" v=${all.rateLimited ?? 0} />
          </div>
        </div>
      </div>`;
  }

  function SessionsIsland({ sessions }) {
    const list = sessions || [];
    return html`
      <div class="island sessions">
        <div class="strip"><span>▣ Sessions</span><span class="muted">${list.length} active</span></div>
        <div class="body">
          ${list.length === 0
            ? html`<div class="muted">no active connections</div>`
            : html`<table>
                <tr><th>state</th><th>id</th><th>key</th><th>elapsed</th><th>ttft</th><th>mode</th></tr>
                ${list.map(s => html`
                  <tr key=${s.id}>
                    <td class="state-${s.state}">${s.state}${s.clientAborted ? html` <span class="aborted">✕ aborted</span>` : ''}</td>
                    <td>${s.id}</td>
                    <td>…${s.keyTail}</td>
                    <td>${s.elapsed.toFixed(1)}s</td>
                    <td>${s.ttft ? fmt(s.ttft) : '-'}</td>
                    <td class="muted">${s.modeTag} try ${s.attempt}/${s.totalKeys}</td>
                  </tr>`)}
              </table>`}
        </div>
      </div>`;
  }

  function TTFTChart({ data }) {
    // SVG 折線圖：wm 實際像素寬度，避免文字被拉伸變形
    const H = 240, PL = 44, PR = 12, PT = 12, PB = 26;
    const [hover, setHover] = useState(null);
    const wrapRef = useRef(null);
    const [W, setW] = useState(900);
    useEffect(() => {
      if (!wrapRef.current) return;
      const ro = new ResizeObserver(es => setW(Math.max(300, es[0].contentRect.width)));
      ro.observe(wrapRef.current);
      return () => ro.disconnect();
    }, []);

    const chart = useMemo(() => {
      if (!data || data.length < 2) return null;
      const vals = data.map(p => p.ttft);
      const max = Math.max(...vals), min = Math.min(...vals);
      const span = max - min || 1;
      const pts = data.map((p, i) => {
        const x = PL + (i / (data.length - 1)) * (W - PL - PR);
        const y = PT + (1 - (p.ttft - min) / span) * (H - PT - PB);
        return { x, y, p };
      });
      const pathStr = pts.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
      const areaStr = pathStr + `L${pts[pts.length-1].x.toFixed(1)},${H - PB}L${pts[0].x.toFixed(1)},${H - PB}Z`;
      // Y 軸 4 格
      const yTicks = [0, 1, 2, 3, 4].map(i => {
        const v = min + (span * i) / 4;
        const y = PT + (1 - i / 4) * (H - PT - PB);
        return { v, y };
      });
      // X 軸最多 5 個時間標籤
      const n = Math.min(5, data.length);
      const xTicks = Array.from({ length: n }, (_, i) => {
        const idx = Math.round(i * (data.length - 1) / (n - 1 || 1));
        const d = new Date(data[idx].ts);
        const label = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        return { x: pts[idx].x, label };
      });
      return { pts, pathStr, areaStr, max, min, yTicks, xTicks };
    }, [data, W]);

    if (!chart) return html`<div class="muted">資料不足</div>`;
    const yMax = chart.max.toFixed(1), yMin = chart.min.toFixed(1);

    const onMove = (e) => {
      const svg = e.currentTarget;
      const rect = svg.getBoundingClientRect();
      const mx = ((e.clientX - rect.left) / rect.width) * W;
      let best = null, bd = Infinity;
      for (const p of chart.pts) { const d = Math.abs(p.x - mx); if (d < bd) { bd = d; best = p; } }
      setHover(best ? { sx: e.clientX, sy: e.clientY, p: best } : null);
    };

    return html`
      <div class="chart-wrap">
        <svg ref=${wrapRef} width=${W} height=${H}
             onMouseMove=${onMove} onMouseLeave=${() => setHover(null)}>
          <defs>
            <linearGradient id="ttftGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#5fd7ff" stop-opacity="0.35" />
              <stop offset="100%" stop-color="#5fd7ff" stop-opacity="0.02" />
            </linearGradient>
          </defs>
          ${chart.yTicks.map(t => html`
            <g key=${t.v}>
              <line x1=${PL} y1=${t.y} x2=${W - PR} y2=${t.y}
                    stroke=${Math.abs(t.v) < 1e-9 ? '#666' : '#2c3340'} stroke-dasharray="3 4" vector-effect="non-scaling-stroke" />
              <text x=${PL - 6} y=${t.y + 4} fill="#8b9bb4" font-size="11" text-anchor="end">${t.v.toFixed(1)}s</text>
            </g>`)}
          ${chart.xTicks.map(t => html`
            <text key=${t.x} x=${t.x} y=${H - 8} fill="#8b9bb4" font-size="11" text-anchor="middle">${t.label}</text>`)}
          <path d=${chart.areaStr} fill="url(#ttftGrad)" />
          <path d=${chart.pathStr} fill="none" stroke="#5fd7ff" stroke-width="1.6"
                stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" />
          ${hover && html`<g>
            <line x1=${hover.p.x} y1=${PT} x2=${hover.p.x} y2=${H - PB} stroke="#8b9bb4" stroke-dasharray="2 3" vector-effect="non-scaling-stroke" />
            <circle cx=${hover.p.x} cy=${hover.p.y} r="4" fill="#0f1420" stroke="#5fd7ff" stroke-width="2" />
          </g>`}
        </svg>
        <div class="chart-legend">
          <span>最近 ${data.length} 筆</span><span>max ${yMax}s</span><span>min ${yMin}s</span>
        </div>
        ${hover && html`<div class="tooltip" style=${{ display: 'block', left: hover.sx + 12 + 'px', top: hover.sy - 10 + 'px' }}>
          ${new Date(hover.p.p.ts).toLocaleTimeString()} · ${hover.p.p.ttft.toFixed(2)}s
        </div>`}
      </div>`;
  }

  function ChartIsland() {
    const [show, setShow] = useState(false);
    const [data, setData] = useState(null);
    useEffect(() => {
      if (!show) return;
      let alive = true;
      const tick = () => fetch('/_api/ttft?limit=120').then(r => r.json()).then(d => alive && setData(d)).catch(() => {});
      tick();
      const t = setInterval(tick, 5000);
      return () => { alive = false; clearInterval(t); };
    }, [show]);

    return html`
      <div class="island info">
        <div class="strip">
          <span>▣ TTFT Chart</span>
          <button onClick=${() => setShow(!show)}>${show ? '隱藏' : '顯示折線圖'}</button>
        </div>
        ${show && html`<div class="body"><${TTFTChart} data=${data} /></div>`}
      </div>`;
  }

  function App() {
    const stats = usePoll('/_api/stats', 2000);
    const sessions = usePoll('/_api/sessions', 2000);
    return html`
      <header>
        <span class="logo">Nvidia NIM Proxy</span>
        <span class="muted">API key aggregator · ${location.host}</span>
      </header>
      <${SessionsIsland} sessions=${sessions} />
      <${StatsIsland} stats=${stats} />
      <${ChartIsland} />
    `;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
